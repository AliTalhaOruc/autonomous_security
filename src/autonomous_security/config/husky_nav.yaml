/**:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    oscillation_distance: 0.2
    oscillation_timeout: 5.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 8.0

    goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.6
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.9
      max_vel_x: 0.9
      max_linear_accel: 2.0
      max_linear_decel: -2.0
      min_linear_velocity: 0.0
      max_angular_accel: 5.0
      min_theta_velocity: 0.8
      max_angular_vel: 2.5
      
      use_velocity_scaled_lookahead_dist: true
      lookahead_dist: 1.0
      min_lookahead_dist: 0.6
      max_lookahead_dist: 1.8
      lookahead_time: 0.7

      # KİLİTLENMEYİ BİTİREN AYAR: Yerinde dönüş zorunluluğunu kapatıp direkt akıcı sürüşe geç
      use_rotate_to_heading: true      
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 2.5
      transform_tolerance: 1.5
      allow_reversing: false
      use_collision_detection: true
      
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.40
      use_cost_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: '[[-0.5, -0.33], [-0.5, 0.33], [0.5, 0.33], [0.5, -0.33]]'
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.75
        cost_scaling_factor: 3.0

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_range: 0.15
          clearing: true
          marking: true
          obstacle_max_range: 5.0
          raytrace_max_range: 6.0
          observation_persistence: 0.0
          inf_is_valid: true
          data_type: "LaserScan"

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      rolling_window: false
      transform_tolerance: 1.5
      width: 60
      height: 60
      origin_x: -30.0
      origin_y: -30.0
      robot_base_frame: base_link
      footprint: '[[-0.5, -0.33], [-0.5, 0.33], [0.5, 0.33], [0.5, -0.33]]'
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          obstacle_max_range: 5.0
          observation_persistence: 0.0
          inf_is_valid: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.90
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    transform_tolerance: 1.5
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5
      allow_unknown: true
      max_iterations: 1000000
      smooth_path: true
      minimum_turning_radius: 0.1
      cost_travel_multiplier: 1.2

behavior_server:
  ros__parameters:
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
      target_yaw: 1.57
    backup:
      plugin: "nav2_behaviors/BackUp"
      backup_dist: 0.5 
      backup_speed: 0.3
    wait:
      plugin: "nav2_behaviors/Wait"
      duration: 0.2
    global_frame: map
    odom_frame: odom
    robot_base_frame: base_link

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_frame: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    transform_tolerance: 1.5

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.9, 0.0, 2.5]
    min_velocity: [-0.3, 0.0, -2.5]
    max_accel: [2.0, 0.0, 5.0]
    max_decel: [-2.0, 0.0, -5.0]

lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ['controller_server', 'planner_server', 'behavior_server', 'bt_navigator', 'waypoint_follower', 'velocity_smoother']
